    --card: rgba(255,255,255,.12);
    --card2: rgba(255,255,255,.2);
    --line: rgba(255,255,255,.16);

    --snow:#7fe0ff; --star:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  html{background:#071a45}
  body{
    min-height:100dvh;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:linear-gradient(180deg,#2f7fe6 0%,#164aa6 38%,#0c2f7a 70%,#071a45 100%);
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px)

  }
  main{max-width:480px;margin:0 auto}
  button{font:inherit;color:inherit}

  /* ヘッダー */
  .top{display:flex;align-items:center;gap:8px;min-height:44px}
  .btn{min-width:44px;height:44px;border:0;border-radius:22px;background:var(--card);color:#fff;
    display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
  .btn:active{transform:scale(.9);background:var(--card2)}
  .btn svg{width:22px;height:22px}
  .btn.spin svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{flex:1;text-align:center;min-width:0}
  .title h1{font-size:19px;font-weight:700;letter-spacing:.02em}
  .title p{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  h2{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.05em;margin:20px 4px 8px;display:flex;justify-content:space-between}
  h2 small{font-weight:600;font-size:12px}

  /* お気に入り */
  .favs{display:grid;gap:10px}
  .fav{position:relative;background:var(--card);border:.5px solid var(--line);border-radius:18px;padding:14px 14px 12px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;transition:transform .12s}
  .fav:active{transform:scale(.98)}
  .fav .head{display:flex;align-items:baseline;gap:8px;padding-right:40px}
  .fav .nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav .pf{font-size:12px;color:var(--dim);white-space:nowrap}
  .fav .row{display:flex;align-items:flex-end;gap:14px;margin-top:6px}
  .big{font-size:46px;font-weight:250;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .big small{font-size:16px;font-weight:500;margin-left:2px;letter-spacing:0}
  .stats{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;font-size:12px;color:var(--dim);flex:1;justify-content:end;text-align:right}
  .stats b{display:block;font-size:16px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  .amd{margin-top:8px;font-size:12px;color:var(--dim);border-top:.5px solid var(--line);padding-top:7px}
  .amd b{color:#fff;font-weight:600}
  .starbtn{position:absolute;top:4px;right:4px;width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--star)}
  .empty{border:1.5px dashed rgba(255,255,255,.3);border-radius:18px;padding:16px;text-align:center;font-size:13px;color:var(--dim);line-height:1.6}

  /* 地域チップ */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:.5px solid var(--line);background:var(--card);
    font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s}
  .chip:active{transform:scale(.94)}
  .chip.on{background:#fff;color:#0c2f7a;border-color:#fff}

  /* スキー場リスト */
  .list{background:var(--card);border:.5px solid var(--line);border-radius:18px;overflow:hidden;margin-top:6px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .item{display:flex;align-items:center;min-height:60px;border-bottom:.5px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 0 9px 14px;cursor:pointer;background:none;border:0;text-align:left}
  .item .main:active{background:rgba(255,255,255,.08)}
  .item .info{flex:1;min-width:0}
  .item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .pf{font-size:11.5px;color:var(--dim)}
  .item .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .val b{font-size:20px;font-weight:600}
  .item .val small{font-size:11px;color:var(--dim)}
  .item .val .nw{display:block;font-size:11.5px;color:var(--snow)}
  .item .star{width:52px;height:60px;border:0;background:none;font-size:22px;cursor:pointer;color:rgba(255,255,255,.4)}
  .item .star.on{color:var(--star)}
  .item .star:active{transform:scale(.85)}
  .skel{display:inline-block;width:44px;height:16px;border-radius:6px;background:rgba(255,255,255,.15);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}

  .note{font-size:11.5px;color:var(--dim);line-height:1.7;margin:20px 4px 0}
  .note a{color:#bfe4ff}
  .err{background:rgba(255,90,106,.2);border:.5px solid rgba(255,90,106,.5);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}

  /* 詳細シート */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;

    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
  .sheet.open{transform:none}
  .sheet .inner{max-width:480px;margin:0 auto}
  .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 6px}
  .shead{display:flex;align-items:center;gap:6px}
  .shead .t{flex:1;min-width:0}
  .shead h3{font-size:21px;font-weight:700}
  .shead p{font-size:12.5px;color:var(--dim)}
  .favbtn{height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--card);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .favbtn.on{background:var(--star);color:#3a2a00}
  .favbtn:active{transform:scale(.94)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .box{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:12px}

  .box .big{font-size:38px;margin-top:4px}
  .box .sub{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6;font-variant-numeric:tabular-nums}
  .box .sub b{color:#fff;font-weight:600}
  .sec{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.05em;margin:16px 2px 8px}
  .chart{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:12px 8px 10px}

  .day .wx{font-size:18px;margin-top:6px}
  .day .d{font-size:11.5px;font-weight:600;margin-top:2px}
  .day .tp{font-size:10.5px;color:var(--dim);margin-top:2px;white-space:nowrap}

  .closebtn{display:block;width:100%;height:48px;margin-top:16px;border:0;border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}

    background:rgba(20,20,30,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;
    transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  {id:'gokase',   n:'五ヶ瀬ハイランド',     p:'宮崎県 五ヶ瀬町', r:'西日本', lat:32.600, lon:131.170, top:1600, base:1400},
];
const BY_ID = Object.fromEntries(RESORTS.map(r => [r.id, r]));
const MAX_FAV = 3;

/* ===== 保存 ===== */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let favs = store.get('snow.favs', []).filter(id => BY_ID[id]).slice(0, MAX_FAV);
let region = store.get('snow.region', '長野・山梨');
if (!REGIONS.includes(region)) region = REGIONS[0];

/* ===== ユーティリティ ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d = 0) => v == null || isNaN(v) ? '--' : (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function wxIcon(code){
  if (code == null) return '';
  if (code === 0) return '☀️';
  if (code <= 2) return '🌤️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌧️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}
function jstHourKey(d = new Date()){
  const j = new Date(d.getTime() + 9 * 3600e3);
  return j.toISOString().slice(0, 13) + ':00'; // "YYYY-MM-DDTHH:00"
}
function distKm(a1, o1, a2, o2){
  const R = 6371, r = Math.PI / 180;
  const dA = (a2 - a1) * r, dO = (o2 - o1) * r;
  const x = Math.sin(dA/2) ** 2 + Math.cos(a1*r) * Math.cos(a2*r) * Math.sin(dO/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ===== Open-Meteo（気象モデル推定） ===== */
const OM = 'https://api.open-meteo.com/v1/forecast';
const TTL = 20 * 60e3;
const cache = new Map(); // key -> {t, data}

async function omFetch(points, extra = ''){
  const q = new URLSearchParams({
    latitude: points.map(p => p.lat).join(','),
    longitude: points.map(p => p.lon).join(','),
    elevation: points.map(p => p.elev).join(','),
    hourly: 'snow_depth,snowfall,temperature_2m',
    daily: 'snowfall_sum,temperature_2m_max,temperature_2m_min,weather_code',
    timezone: 'Asia/Tokyo', past_days: '1', forecast_days: '7'
  });
  const res = await fetch(OM + '?' + q + extra);
  if (!res.ok) throw new Error('Open-Meteo ' + res.status);
  const j = await res.json();
  return Array.isArray(j) ? j : [j];
}
async function omSnowDepthFallback(points){
  const q = new URLSearchParams({
    latitude: points.map(p => p.lat).join(','),
    longitude: points.map(p => p.lon).join(','),
    hourly: 'snow_depth', models: 'gfs_seamless',
    timezone: 'Asia/Tokyo', past_days: '1', forecast_days: '1'
  });
  const res = await fetch(OM + '?' + q);
  if (!res.ok) return null;
  const j = await res.json();
  return Array.isArray(j) ? j : [j];
}

function summarize(j, depthAlt){
  const h = j.hourly, key = jstHourKey();
  let i = h.time.indexOf(key);
  if (i < 0) i = h.time.findIndex(t => t > key) - 1;
  if (i < 0) i = 24;
  const sum = (a, from, to) => { let s = 0; for (let k = Math.max(0, from); k <= Math.min(a.length - 1, to); k++) s += a[k] || 0; return s; };
  const pickDepth = arr => { if (!arr) return null; for (let k = i; k >= Math.max(0, i - 6); k--) if (arr[k] != null) return arr[k] * 100; return null; };
  let depth = pickDepth(h.snow_depth);
  if (depth == null && depthAlt) {
    const ah = depthAlt.hourly, ai = ah.time.indexOf(key);
    if (ai >= 0) for (let k = ai; k >= Math.max(0, ai - 6); k--) if (ah.snow_depth[k] != null) { depth = ah.snow_depth[k] * 100; break; }
  }
  const d = j.daily;
  return {
    depth,                                   // cm
    new24: sum(h.snowfall, i - 23, i),       // 過去24h 降雪 cm
    next24: sum(h.snowfall, i + 1, i + 24),  // 今後24h 予報 cm
    temp: h.temperature_2m[i],
    days: d.time.slice(1).map((t, k) => ({
      date: t, snow: d.snowfall_sum[k + 1], hi: d.temperature_2m_max[k + 1], lo: d.temperature_2m_min[k + 1], code: d.weather_code[k + 1]
    }))
  };
}

// 中腹の標高で一括取得（リスト・お気に入り用）
async function loadMid(ids, force = false){
  const need = ids.filter(id => force || !cache.has('mid:' + id) || Date.now() - cache.get('mid:' + id).t > TTL);
  if (!need.length) return;
  const pts = need.map(id => { const r = BY_ID[id]; return { lat: r.lat, lon: r.lon, elev: Math.round((r.top + r.base) / 2) }; });
  const res = await omFetch(pts);
  let alt = null;
  if (res.some(j => !j.hourly.snow_depth || j.hourly.snow_depth.every(v => v == null))) {
    try { alt = await omSnowDepthFallback(pts); } catch {}
  }
  need.forEach((id, k) => cache.set('mid:' + id, { t: Date.now(), data: summarize(res[k], alt && alt[k]) }));
}
const mid = id => cache.get('mid:' + id)?.data;

/* ===== 気象庁アメダス（実測） ===== */
const AMD = 'https://www.jma.go.jp/bosai/amedas/';
let amdTable = null, amdMap = null, amdTime = null, amdT = 0, amdFailed = false;
async function loadAmedas(force = false){
  if (amdFailed && !force) return false;
  if (!force && amdMap && Date.now() - amdT < 10 * 60e3) return true;
  try {
    if (!amdTable) amdTable = await (await fetch(AMD + 'const/amedastable.json')).json();
    const lt = (await (await fetch(AMD + 'data/latest_time.txt', { cache: 'no-store' })).text()).trim();
    const ts = lt.slice(0,4) + lt.slice(5,7) + lt.slice(8,10) + lt.slice(11,13) + lt.slice(14,16) + '00';
    amdMap = await (await fetch(AMD + 'data/map/' + ts + '.json')).json();
    amdTime = lt.slice(11, 16); amdT = Date.now(); amdFailed = false;
    return true;
  } catch (e) {
    amdFailed = true; return false;
  }
}
function nearestAmedas(r){
  if (!amdTable || !amdMap) return null;
  let best = null;
  for (const [code, s] of Object.entries(amdTable)) {
    const ob = amdMap[code];
    if (!ob || !ob.snow || ob.snow[0] == null) continue;
    const lat = s.lat[0] + s.lat[1] / 60, lon = s.lon[0] + s.lon[1] / 60;
    const d = distKm(r.lat, r.lon, lat, lon);
    if (d <= 40 && (!best || d < best.d)) best = { d, name: s.kjName, alt: s.alt, snow: ob.snow[0], s24: ob.snow24h ? ob.snow24h[0] : null };
  }
  return best;
}
function amedasText(r, long = false){
  if (amdFailed) return long ? 'アメダスのデータを取得できませんでした。' : '';
  if (!amdMap) return long ? '読み込み中…' : '';
  const a = nearestAmedas(r);
  if (!a) return long ? '40km以内に積雪を観測しているアメダスがありません（積雪観測は冬季・一部地点のみ）。' : '';
  const s24 = a.s24 != null && a.s24 > 0 ? `（24h +${a.s24}cm）` : '';
  return long
    ? `<b>${esc(a.name)}</b>（標高${a.alt}m・約${Math.round(a.d)}km）<br>積雪 <b>${a.snow}cm</b>${s24}　${esc(amdTime)} 観測`
    : `アメダス ${esc(a.name)}（${a.alt}m）: <b>${a.snow}cm</b>${s24}`;
}

/* ===== 描画 ===== */
function renderFavs(){
  $('favCount').textContent = `${favs.length} / ${MAX_FAV}`;
  const box = $('favs');
  if (!favs.length) {
    box.innerHTML = `<div class="empty">下のリストの <span style="color:var(--star)">☆</span> をタップすると<br>お気に入りに登録できます（3つまで）</div>`;
    return;
  }
  box.innerHTML = favs.map(id => {
    const r = BY_ID[id], m = mid(id);
    const am = amedasText(r);
    return `<div class="fav" data-id="${id}">
      <div class="head"><span class="nm">${esc(r.n)}</span><span class="pf">${esc(r.p)}</span></div>
      <div class="row">
        <div><div style="font-size:11px;color:var(--dim)">推定積雪</div><div class="big">${m ? fmt(m.depth) : '--'}<small>cm</small></div></div>
        <div class="stats">
          <div>24h新雪<b>${m ? fmt(m.new24) : '--'}<small style="font-size:11px">cm</small></b></div>
          <div>24h予報<b>${m ? fmt(m.next24) : '--'}<small style="font-size:11px">cm</small></b></div>
          <div>気温<b>${m ? fmt(m.temp) : '--'}°</b></div>
        </div>
      </div>
      ${am ? `<div class="amd">${am}</div>` : ''}
      <button class="starbtn" data-star="${id}" aria-label="お気に入り解除">★</button>
    </div>`;
  }).join('') + (favs.length < MAX_FAV ? `<div class="empty">あと ${MAX_FAV - favs.length} つ登録できます</div>` : '');
}

function renderChips(){
  $('chips').innerHTML = REGIONS.map(g => `<button class="chip${g === region ? ' on' : ''}" data-region="${g}">${g}</button>`).join('');
  const on = $('chips').querySelector('.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderList(){
  const items = RESORTS.filter(r => r.r === region);
  $('list').innerHTML = items.map(r => {
    const m = mid(r.id), on = favs.includes(r.id);
    const val = m
      ? `<b>${fmt(m.depth)}</b><small>cm</small><span class="nw">${m.new24 >= 0.5 ? '新雪 +' + fmt(m.new24) + 'cm' : (m.next24 >= 0.5 ? '予報 +' + fmt(m.next24) + 'cm' : '新雪なし')}</span>`
      : `<span class="skel"></span>`;
    return `<div class="item">
      <button class="main" data-id="${r.id}">
        <div class="info"><div class="nm">${esc(r.n)}</div><div class="pf">${esc(r.p)}・${r.base}–${r.top}m</div></div>
        <div class="val">${val}</div>
      </button>
      <button class="star${on ? ' on' : ''}" data-star="${r.id}" aria-label="${on ? 'お気に入り解除' : 'お気に入りに追加'}">${on ? '★' : '☆'}</button>
    </div>`;
  }).join('');
}

function toggleFav(id){
  if (favs.includes(id)) {
    favs = favs.filter(x => x !== id);
    toast('お気に入りから外しました');
  } else {
    if (favs.length >= MAX_FAV) { toast('お気に入りは3つまでです'); return; }
    favs.push(id);
    toast('お気に入りに追加しました');
  }
  store.set('snow.favs', favs);
  renderFavs(); renderList();
  if (openId === id) renderSheetFav();
  loadMid(favs).then(renderFavs).catch(() => {});
  loadAmedas().then(renderFavs);
}

/* ===== 詳細シート ===== */
let openId = null;
function renderSheetFav(){
  const on = favs.includes(openId);
  $('sFav').className = 'favbtn' + (on ? ' on' : '');
  $('sFav').textContent = on ? '★ 登録済み' : '☆ お気に入り';
}
function boxSub(s){
  return `24h新雪 <b>${fmt(s.new24)}cm</b>・24h予報 <b>${fmt(s.next24)}cm</b><br>気温 <b>${fmt(s.temp, 1)}°C</b>`;
}
async function openSheet(id){
  const r = BY_ID[id]; openId = id;
  $('sName').textContent = r.n;
  $('sPref').textContent = `${r.p}・標高 ${r.base}–${r.top}m`;
  $('sTopLb').textContent = `山頂付近（${r.top}m）`;
  $('sBaseLb').textContent = `山麓（${r.base}m）`;
  ['sTopDepth','sBaseDepth'].forEach(k => $(k).innerHTML = '--');
  ['sTopSub','sBaseSub'].forEach(k => $(k).textContent = '読み込み中…');
  $('sChart').innerHTML = '';
  $('sAmd').innerHTML = amedasText(r, true);
  renderSheetFav();
  $('backdrop').classList.add('open'); $('sheet').classList.add('open');
  $('sheet').scrollTop = 0;

  try {
    let tb = cache.get('tb:' + id);
    if (!tb || Date.now() - tb.t > TTL) {
      const pts = [{ lat: r.lat, lon: r.lon, elev: r.top }, { lat: r.lat, lon: r.lon, elev: r.base }];
      const res = await omFetch(pts);
      let alt = null;
      if (!res[0].hourly.snow_depth || res[0].hourly.snow_depth.every(v => v == null)) { try { alt = await omSnowDepthFallback(pts); } catch {} }
      tb = { t: Date.now(), data: [summarize(res[0], alt && alt[0]), summarize(res[1], alt && alt[1])] };
      cache.set('tb:' + id, tb);
    }
    if (openId !== id) return;
    const [top, base] = tb.data;
    $('sTopDepth').innerHTML = `${fmt(top.depth)}<small>cm</small>`;
    $('sBaseDepth').innerHTML = `${fmt(base.depth)}<small>cm</small>`;
    $('sTopSub').innerHTML = boxSub(top);
    $('sBaseSub').innerHTML = boxSub(base);
    renderChart(top.days);
  } catch (e) {
    if (openId !== id) return;
    ['sTopSub','sBaseSub'].forEach(k => $(k).textContent = '取得できませんでした');
  }
  if (await loadAmedas() && openId === id) $('sAmd').innerHTML = amedasText(r, true);
  else if (openId === id) $('sAmd').innerHTML = amedasText(r, true);
}
function renderChart(days){
  const max = Math.max(5, ...days.map(d => d.snow || 0));
  const wd = ['日','月','火','水','木','金','土'];
  $('sChart').innerHTML = days.map((d, k) => {
    const dt = new Date(d.date + 'T00:00:00+09:00');
    const label = k === 0 ? '今日' : k === 1 ? '明日' : wd[dt.getDay()];
    const v = d.snow || 0;
    return `<div class="day">
      <div class="v">${v >= 0.5 ? fmt(v) : ''}</div>
      <div class="barwrap"><div class="bar" style="height:${Math.round(v / max * 100)}%"></div></div>
      <div class="wx">${wxIcon(d.code)}</div>
      <div class="d">${label}</div>
      <div class="tp"><span class="hi">${fmt(d.hi)}</span>/<span class="lo">${fmt(d.lo)}</span></div>
    </div>`;
  }).join('');
}
function closeSheet(){
  openId = null;
  $('backdrop').classList.remove('open'); $('sheet').classList.remove('open');
}

/* ===== 読み込み ===== */
async function refresh(force = false){
  const btn = $('reload'); btn.classList.add('spin'); $('err').style.display = 'none';
  const ids = [...new Set([...favs, ...RESORTS.filter(r => r.r === region).map(r => r.id)])];
  try {
    await loadMid(ids, force);
    const d = new Date();
    $('updated').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 更新`;
  } catch (e) {
    $('err').textContent = 'データを取得できませんでした。通信状況を確認して、右上の更新ボタンを押してください。';
    $('err').style.display = 'block';
    $('updated').textContent = '取得エラー';
  }
  renderFavs(); renderList();
  btn.classList.remove('spin');
  if (favs.length) loadAmedas(force).then(renderFavs);
}

/* ===== イベント ===== */
document.addEventListener('click', e => {
  const star = e.target.closest('[data-star]');
  if (star) { e.stopPropagation(); toggleFav(star.dataset.star); return; }
  const chip = e.target.closest('[data-region]');
  if (chip) {
    region = chip.dataset.region; store.set('snow.region', region);
    renderChips(); renderList(); refresh();
    return;
  }
  const item = e.target.closest('[data-id]');
  if (item) openSheet(item.dataset.id);
});
$('reload').addEventListener('click', () => { cache.clear(); refresh(true); });
$('backdrop').addEventListener('click', closeSheet);
$('sClose').addEventListener('click', closeSheet);
$('sFav').addEventListener('click', () => openId && toggleFav(openId));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

renderChips(); renderFavs(); renderList(); refresh();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
