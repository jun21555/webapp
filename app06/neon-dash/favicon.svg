<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1680"/>
      <stop offset=".72" stop-color="#170a3d"/>
      <stop offset="1" stop-color="#0a0520"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dfcff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3dfcff" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#b88cff" stroke-opacity=".18" stroke-width="6" fill="none">
    <rect x="300" y="70" width="110" height="110"/>
    <rect x="60" y="120" width="70" height="70"/>
  </g>
  <!-- 地面 -->
  <rect x="0" y="380" width="512" height="132" fill="#1d0b45"/>
  <rect x="0" y="372" width="512" height="16" fill="#3dfcff" opacity=".45" filter="url(#glow)"/>
  <rect x="0" y="376" width="512" height="7" fill="#e9fdff"/>
  <!-- トゲ -->
  <path d="M318 378 L360 300 L402 378 Z" fill="#07040f"/>
  <path d="M318 378 L360 300 L402 378 Z" fill="none" stroke="#3dfcff" stroke-width="16" stroke-opacity=".4" filter="url(#glow)"/>
  <path d="M318 378 L360 300 L402 378 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <!-- 軌跡 -->
  <path d="M40 330 Q120 300 170 220" stroke="url(#trail)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- キューブ -->
  <g transform="translate(228 196) rotate(-18)">
    <rect x="-82" y="-82" width="164" height="164" fill="#ffe44d" filter="url(#glow)" opacity=".7"/>
    <rect x="-80" y="-80" width="160" height="160" fill="#ffe44d" stroke="#000" stroke-width="12"/>
    <rect x="-50" y="-50" width="100" height="100" fill="#3dfcff" stroke="#000" stroke-width="10"/>
    <path d="M0 -34 L34 0 L0 34 L-34 0 Z" fill="#ffe44d" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
  </g>
</svg>
