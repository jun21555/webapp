<style>

    box-shadow:0 0 0 1px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);transition:transform .12s}
  .lv:active{transform:scale(.96)}
  .lv .face{flex:none;width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font:900 24px/1 ui-rounded,sans-serif;border:2px solid #fff}
  .lv .meta{flex:1;min-width:0}
  .lv .nm{font:800 18px/1.15 ui-rounded,-apple-system,sans-serif;letter-spacing:.02em}
  .lv .jp{font-size:12px;opacity:.75;margin-top:2px}
  .lv .st{color:#ffe44d;font-size:13px;letter-spacing:2px;margin-top:3px}
  .lv .bars{display:flex;flex-direction:column;gap:4px;width:84px;flex:none}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar i{display:block;height:100%}

  .bars small{font-size:10.5px;opacity:.85;display:flex;justify-content:space-between}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .chip{min-height:44px;padding:0 18px;border-radius:22px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.4);
    font-weight:700;font-size:15px;cursor:pointer;touch-action:manipulation}

  #colors{display:flex;gap:6px;margin-top:14px;align-items:center}

  .sw{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);touch-action:manipulation}

  h2{margin:0 0 6px;font:900 34px/1.05 ui-rounded,"Arial Black",sans-serif;text-align:center;letter-spacing:.02em;

<body>

  </div>

<script>
/*ENGINE-START*/
// ===== 物理定数（単位: ブロック・秒） =====
const PH = { G: 87, JUMP: 19.6, VMAX: 26, PAD: 27, ORB: 19.6, SHIP_A: 34, SHIP_V: 7.5, DT: 1 / 240, CEIL: 9 };

// ===== レベル記法 =====
// 文字列チャンク: '/' で行を区切り、上の行→下の行（最後の行が地面の高さ y=0）
//  # ブロック  ^ トゲ  v 逆さトゲ  _ ジャンプパッド  o ジャンプリング  S 飛行ゲート  C キューブゲート  . 空白
const g = n => '.'.repeat(n);
// 飛行区間の柱: 下から高さ b、天井から高さ t（先端にトゲ）
function P(b, t, w = 1, sp = true) {
  const cols = [];
  for (let i = 0; i < w; i++) {
    const c = new Array(PH.CEIL).fill('.');
    for (let y = 0; y < b; y++) c[y] = '#';
    if (sp && b > 0) c[b] = '^';
    for (let y = PH.CEIL - t; y < PH.CEIL; y++) c[y] = '#';
    if (sp && t > 0) c[PH.CEIL - t - 1] = 'v';
    cols.push(c.join(''));
  }
  return { cols };
}
function chunkCols(ch) {
  if (typeof ch === 'object') return ch.cols;
  const rows = ch.split('/').reverse();
  const w = Math.max(...rows.map(r => r.length));
  const cols = [];
  for (let i = 0; i < w; i++) { let s = ''; for (const r of rows) s += r[i] || '.'; cols.push(s); }
  return cols;
}

const LEVELS = [
  { name: 'FIRST BEAT', jp: 'はじまりのビート', stars: 1, speed: 10, bpm: 120, hue: 205, seed: 11, key: 45, color: '#4dc3ff',
    chunks: [
      g(22), '^', g(12), '^', g(12), '^^', g(12), '^......^', g(12),
      '###', g(10), '###.......###', g(10),
      '####^^^####', g(10),
      '.....##/##...##', g(12),
      '_', g(12), '^^', g(10),
      '#....#....#', g(12),
      '...o....o...../............../..^^^^^^^^^^...', g(10),
      '.........####/.....########/#############', g(7), '^', g(12),
      '....######/........../_...^^^^^^', g(12),
      '^.....^^', g(12), '##^^##^^##', g(14), '^^', g(26)
    ] },
  { name: 'NEON SKYLINE', jp: 'ネオンの夜空', stars: 2, speed: 10.4, bpm: 128, hue: 275, seed: 23, key: 43, color: '#c46bff',
    chunks: [
      g(20), '^^', g(10), '^^^', g(12),
      '...##..##..##/#^^##^^##^^##', g(12),
      '_..._...^^^', g(12),
      '..o..../......./^^^^^^^', g(10),
      'S', g(10), P(4, 0, 2), g(7), P(0, 4, 2), g(7), P(3, 3, 2, false), g(7), P(5, 0, 2), g(7), P(0, 5, 2), g(7),
      P(2, 2, 6, false), g(8), 'C', g(14),
      '^^^', g(12), '#..##..###', g(4), '^^', g(12),
      '....o....o..../............../_^^^^^^^^^^^^^', g(12),
      '......###/...######/#########', g(5), '^^', g(12),
      '^^.....^^^', g(28)
    ] },
  { name: 'OVERDRIVE', jp: 'オーバードライブ', stars: 3, speed: 11.4, bpm: 140, hue: 335, seed: 37, key: 40, color: '#ff4f8a',
    chunks: [
      g(20), '^^^', g(10), '^.....^^^', g(12),
      '..##...##...##/#^^^^^^^^^^^^^^', g(10),
      '_...o...o.../.........../....^^^^^^^^', g(12),
      '#^^#^^#^^#', g(10),
      'S', g(8), P(5, 0, 2), g(6), P(0, 5, 2), g(6), P(4, 2, 2, false), g(6), P(1, 5, 2, false), g(6), P(5, 1, 2, false), g(6),
      P(2, 4, 3, false), g(6), 'C', g(12),
      '^^.....^^^', g(12),
      '...o...o...o..../................/^^^^^^^^^^^^^^^^', g(10),
      '.......#####/....########/_..^#########', g(5), '^^^', g(12),
      'S', g(8), P(3, 3, 4, false), g(5), P(5, 1, 3, false), g(5), P(1, 5, 3, false), g(6), 'C', g(12),
      '^^^', g(8), '###^^^###', g(30)
    ] }
];

function buildLevel(def) {
  const cols = []; for (const ch of def.chunks) cols.push(...chunkCols(ch));
  const objs = [], solid = new Set(), buckets = [];
  let id = 0;
  cols.forEach((c, x) => {
    for (let y = 0; y < c.length; y++) {
      const k = c[y]; if (k === '.') continue;
      const o = { k, x, y, id: id++ };
      if (k === '#') solid.add(x + ',' + y);
      objs.push(o); (buckets[x] ||= []).push(o);
    }
  });
  const endX = cols.length;
  const regions = []; let cur = null;
  for (const o of objs.filter(o => o.k === 'S' || o.k === 'C')) {
    if (o.k === 'S' && !cur) cur = { a: o.x };
    else if (o.k === 'C' && cur) { cur.b = o.x; regions.push(cur); cur = null; }
  }
  if (cur) { cur.b = endX; regions.push(cur); }
  return { def, objs, solid, buckets, endX, regions, speed: def.speed };
}
function newPlayer() {
  return { x: 0, y: 0, vy: 0, mode: 'cube', ground: true, ceil: Infinity, used: new Set(), fresh: false, prev: false,
    dead: false, won: false, jumps: 0, ev: null };
}
function clonePlayer(p) { return { ...p, used: new Set(p.used) }; }
const ov = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function step(p, L, held, dt = PH.DT) {
  if (held && !p.prev) p.fresh = true;
  if (!held) p.fresh = false;
  p.prev = held;
  p.x += L.speed * dt;
  if (p.mode === 'cube') {
    if (p.ground && held) { p.vy = PH.JUMP; p.ground = false; p.fresh = false; p.jumps++; }
    p.vy = Math.max(p.vy - PH.G * dt, -PH.VMAX);
  } else {
    p.vy += (held ? PH.SHIP_A : -PH.SHIP_A) * dt;
    p.vy = Math.max(-PH.SHIP_V, Math.min(PH.SHIP_V, p.vy));
  }
  p.y += p.vy * dt;
  p.ground = false;
  if (p.y <= 0) { p.y = 0; if (p.vy < 0) p.vy = 0; p.ground = true; }
  if (p.y + 1 >= p.ceil) { p.y = p.ceil - 1; if (p.vy > 0) p.vy = 0; }
  const x0 = Math.floor(p.x) - 1;
  for (let cx = x0; cx <= x0 + 3; cx++) {
    const b = L.buckets[cx]; if (!b) continue;
    for (const o of b) {
      switch (o.k) {
        case '#':
          if (!ov(p.x, p.y, 1, 1, o.x, o.y, 1, 1)) break;
          if (p.vy <= 0 && p.y >= o.y + 0.65 && !L.solid.has(o.x + ',' + (o.y + 1))) { p.y = o.y + 1; p.vy = 0; p.ground = true; }
          else if (p.mode === 'ship' && p.vy >= 0 && p.y + 1 <= o.y + 0.35 && !L.solid.has(o.x + ',' + (o.y - 1))) { p.y = o.y - 1; p.vy = 0; }
          else if (ov(p.x + .3, p.y + .3, .4, .4, o.x, o.y, 1, 1)) p.dead = true;
          break;
        case '^': if (ov(p.x + .12, p.y + .12, .76, .76, o.x + .3, o.y, .4, .5)) p.dead = true; break;
        case 'v': if (ov(p.x + .12, p.y + .12, .76, .76, o.x + .3, o.y + .5, .4, .5)) p.dead = true; break;
        case '_':
          if (ov(p.x, p.y, 1, 1, o.x, o.y, 1, .3)) {
            p.vy = p.mode === 'ship' ? PH.SHIP_V : PH.PAD; p.ground = false;
            if (!p.used.has(o.id)) { p.used.add(o.id); p.ev = 'pad'; }
          }
          break;
        case 'o':
          if (p.fresh && !p.used.has(o.id) && Math.abs(p.x - o.x) < .95 && Math.abs(p.y - o.y) < .95) {
            p.used.add(o.id); p.vy = p.mode === 'ship' ? PH.SHIP_V : PH.ORB; p.fresh = false; p.ground = false; p.ev = 'orb';
          }
          break;
        case 'S':
          if (!p.used.has(o.id) && p.x + 1 > o.x + .5) {
            p.used.add(o.id); p.mode = 'ship'; p.ceil = PH.CEIL; p.vy = Math.min(p.vy, PH.SHIP_V); p.ev = 'portal';
            if (p.y + 1 > p.ceil) p.y = p.ceil - 1;
          }
          break;
        case 'C':
          if (!p.used.has(o.id) && p.x + 1 > o.x + .5) {
            p.used.add(o.id); p.mode = 'cube'; p.ceil = Infinity; p.vy = Math.min(p.vy, 4); p.ev = 'portal';
          }
          break;
      }
      if (p.dead) return;
    }
  }
  if (p.x >= L.endX) p.won = true;
}
/*ENGINE-END*/

// ================= ここからブラウザ側 =================
const $ = s => document.querySelector(s);
const STORE = 'neon-dash-v1';
let save = { best: [], prac: [], att: [], sound: true, color: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (_) {}
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (_) {} };

const COLORS = [['#ffe44d', '#3dfcff'], ['#7dff6a', '#ffffff'], ['#ff5ad1', '#ffe44d'], ['#4d9bff', '#ff7a3d'], ['#ff4f4f', '#ffffff'], ['#ffffff', '#b06bff']];

// ===== サウンド（Web Audio で合成） =====
const AU = { ctx: null, master: null, bus: null, timer: null, t0: 0, spb: .125, step: 0, song: null, noise: null };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AU.ctx = new C();
  AU.master = AU.ctx.createGain(); AU.master.gain.value = save.sound ? .6 : 0; AU.master.connect(AU.ctx.destination);
  const len = AU.ctx.sampleRate * .5, buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;
  const s = AU.ctx.createBufferSource(); s.buffer = AU.ctx.createBuffer(1, 1, 22050); s.connect(AU.master); s.start(0);
}
function setSound(on) {
  save.sound = on; persist();
  if (AU.master) AU.master.gain.setTargetAtTime(on ? .6 : 0, AU.ctx.currentTime, .02);
  const t = on ? '♪ サウンド ON' : '♪ サウンド OFF';
  $('#sndTg').textContent = t; $('#sndB').textContent = t; $('#sndTg').classList.toggle('on', on);
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function kick(t, out) {
  const c = AU.ctx, o = c.createOscillator(), gg = c.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .13);
  env(gg, t, .002, .9, .26); o.connect(gg).connect(out); o.start(t); o.stop(t + .3);
}
function noiseHit(t, out, type, freq, vol, dec) {
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), gg = c.createGain();
  s.buffer = AU.noise; f.type = type; f.frequency.value = freq; f.Q.value = type === 'bandpass' ? 1.2 : .7;

  } else if (state === 'dying') {
    acc = 0; dieT += dt;
    if (dieT > (practice ? .55 : .8)) newAttempt(false);
  } else if (state === 'won') {
    acc = 0; dieT += dt; p.x += L.speed * dt * Math.max(0, 1 - dieT * 1.5);
  }
  // カメラ
  if (state === 'play' || state === 'won') camX = p.x;
  camY += (targetCamY() - camY) * Math.min(1, dt * 5);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 3);
  const hue = L.def.hue + (p.x / L.endX) * 50 + (p.mode === 'ship' ? 25 : 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 30, (Math.random() - .5) * shake * 30);
  drawBG(hue, camX, pulse);
  drawLevel(hue, pulse);
  drawGround(hue, camX, pulse);
  // 挑戦回数の表示
  if (camX < 40) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `800 ${bs * .9}px ui-rounded,-apple-system,sans-serif`; ctx.textAlign = 'left'; ctx.fillText(`Attempt ${attempts}`, X(4), Y(4.2)); }
  // チェックポイント
  if (practice) for (const c of cps) {
    const sx = X(c.p.x + .5), sy = Y(c.p.y + .5); if (sx < -bs || sx > W + bs) continue;
    ctx.fillStyle = '#7dff6a'; ctx.beginPath(); ctx.moveTo(sx, sy - bs * .45); ctx.lineTo(sx + bs * .3, sy); ctx.lineTo(sx, sy + bs * .45); ctx.lineTo(sx - bs * .3, sy); ctx.closePath(); ctx.fill();
  }
  // 軌跡
  if (state === 'play') {
    trailT += dt;
    if (trailT > .03) {
      trailT = 0;
      if (p.mode === 'ship') parts.push({ x: p.x + .05, y: p.y + .45, vx: -3, vy: (Math.random() - .5) * 2, life: .35, max: .35, c: input.down ? '#ffb13d' : '#ff6a3d', s: .22, g: 0 });
      else if (p.ground) parts.push({ x: p.x + .1, y: p.y + .05, vx: -2, vy: 1 + Math.random() * 2, life: .25, max: .25, c: 'rgba(255,255,255,.7)', s: .12 });
    }
  }
  if (state !== 'dying') drawPlayer(p, COLORS[save.color]);
  drawParts(dt);
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
}
requestAnimationFrame(frame);

// ===== メニュー =====
function renderMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'lv';
    const best = save.best[i] || 0, pr = save.prac[i] || 0;
    b.innerHTML = `<div class="face" style="background:${lv.color};box-shadow:0 0 14px ${lv.color}">${i + 1}</div>
      <div class="meta"><div class="nm">${lv.name}</div><div class="jp">${lv.jp}</div><div class="st">${'★'.repeat(lv.stars)}${'☆'.repeat(3 - lv.stars)}</div></div>
      <div class="bars"><small><span>通常</span><span>${best}%</span></small><div class="bar n"><i style="width:${best}%"></i></div>
      <small><span>練習</span><span>${pr}%</span></small><div class="bar p"><i style="width:${pr}%"></i></div></div>`;
    b.addEventListener('click', () => startLevel(i));
    box.appendChild(b);
  });
}
function setPractice(on) {
  practice = on;
  $('#practiceTg').textContent = on ? '練習モード ON' : '練習モード OFF'; $('#practiceTg').classList.toggle('on', on);
}
$('#practiceTg').addEventListener('click', () => setPractice(!practice));
$('#sndTg').addEventListener('click', () => { auInit(); setSound(!save.sound); });
$('#sndB').addEventListener('click', () => { auInit(); setSound(!save.sound); });
COLORS.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'sw' + (i === save.color ? ' on' : ''); b.setAttribute('aria-label', 'カラー' + (i + 1));
  b.innerHTML = `<i style="background:${c[0]};border-color:${c[1]}"></i>`;
  b.addEventListener('click', () => { save.color = i; persist(); document.querySelectorAll('.sw').forEach((x, j) => x.classList.toggle('on', j === i)); });
  $('#colors').appendChild(b);
});
$('#pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('#pauseBtn').addEventListener('click', pause);
$('#resumeB').addEventListener('click', resume);
$('#retryB').addEventListener('click', () => { show('play'); cps = []; newAttempt(true); });
$('#pracB').addEventListener('click', () => { setPractice(!practice); show('play'); cps = []; newAttempt(true); });
$('#menuB').addEventListener('click', () => show('menu'));
$('#menu2B').addEventListener('click', () => show('menu'));
$('#againB').addEventListener('click', () => startLevel(lvIdx));
$('#nextB').addEventListener('click', () => startLevel(Math.min(LEVELS.length - 1, lvIdx + 1)));
$('#home').addEventListener('click', () => { musicStop(); persist(); });
setPractice(false); setSound(save.sound); show('menu');

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
