<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Sound Visualizer</title>
<style>
  :root { --fg:#fff; --dim:rgba(255,255,255,.55); --panel:rgba(20,20,24,.72); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center; background:radial-gradient(circle at 50% 40%,#1b1630 0%,#000 70%); z-index:5; }
  #start h1 { margin:0; font-size:28px; letter-spacing:.04em; font-weight:700; }
  #start p { margin:0; color:var(--dim); font-size:14px; line-height:1.7; max-width:320px; }
  #go { margin-top:8px; border:0; border-radius:999px; padding:16px 36px; font-size:17px; font-weight:600; color:#000;
    background:linear-gradient(90deg,#7cf,#c9f,#f8a); }
  #go:active { transform:scale(.97); }
  #err { color:#ff8a8a; font-size:13px; min-height:1em; max-width:320px; line-height:1.6; }

  #ui { position:fixed; left:0; right:0; bottom:0; z-index:4;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px; transition:opacity .4s, transform .4s; }
  #ui.hidden { opacity:0; transform:translateY(20px); pointer-events:none; }
  .row { display:flex; gap:8px; justify-content:center; }
  .seg { display:flex; background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:14px; padding:4px; gap:2px; }
  .seg button { border:0; background:transparent; color:var(--dim); padding:9px 14px; border-radius:10px; font-size:14px; font-weight:600; }
  .seg button.on { background:rgba(255,255,255,.16); color:#fff; }
  .slider { display:flex; align-items:center; gap:10px; background:var(--panel); -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px); border-radius:14px; padding:10px 14px; font-size:13px; color:var(--dim); flex:1; max-width:420px; }
  .slider input { flex:1; accent-color:#c9f; }
  #hint { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
    font-size:12px; color:var(--dim); z-index:4; transition:opacity .4s; pointer-events:none; }
  #hint.hidden { opacity:0; }
  #level { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:14px; width:6px; height:60px;
    background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; z-index:4; transition:opacity .4s; }
  #level i { position:absolute; left:0; right:0; bottom:0; background:#7cf; }
  #level.hidden { opacity:0; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <h1>Sound Visualizer</h1>
  <p>マイクで周りの音楽を拾って、リアルタイムに描きます。<br>スピーカーの近くに置くとよく反応します。</p>
  <button id="go">はじめる</button>
  <div id="err"></div>
</div>

<div id="hint" class="hidden">画面をタップでメニューを表示／非表示</div>
<div id="level" class="hidden"><i></i></div>

<div id="ui" class="hidden">
  <div class="row">
    <div class="seg" id="modes">
      <button data-m="bars" class="on">バー</button>
      <button data-m="circle">サークル</button>
      <button data-m="wave">波形</button>
      <button data-m="particles">粒子</button>
    </div>
  </div>
  <div class="row">
    <div class="slider">感度 <input id="gain" type="range" min="0.5" max="4" step="0.1" value="1.6"></div>
    <div class="seg" id="pal">
      <button data-p="0" class="on">●</button>
      <button data-p="1">●</button>
      <button data-p="2">●</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const g = cv.getContext('2d');
  const $ = s => document.querySelector(s);
  let W = 0, H = 0, DPR = 1;
  let ctx, analyser, freq, wave, stream;
  let mode = 'bars', gain = 1.6, palette = 0, t = 0;
  let wakeLock = null;

  const PALETTES = [
    h => `hsl(${(200 + h * 140) % 360} 95% 62%)`,           // 青→ピンク
    h => `hsl(${(20 + h * 50) % 360} 100% ${50 + h * 15}%)`, // 夕焼け
    h => `hsl(${(140 + h * 60) % 360} 90% ${45 + h * 20}%)`  // ネオングリーン
  ];
  const col = h => PALETTES[palette](h);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  async function start() {
    $('#err').textContent = '';
    if (!window.isSecureContext) {
      $('#err').textContent = 'HTTPSで開いてください（http:// ではマイクが使えません）。';
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('#err').textContent = 'このブラウザはマイク入力に対応していません。Safariで開いてください。';
      return;
    }
    try {
      // AudioContextはタップ処理の中で作る（iOSの制約）
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      if (ctx.state === 'suspended') await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.78;
      analyser.minDecibels = -90;
      analyser.maxDecibels = -15;
      src.connect(analyser); // スピーカーには繋がない（ハウリング防止）
      freq = new Uint8Array(analyser.frequencyBinCount);
      wave = new Uint8Array(analyser.fftSize);

      $('#start').style.display = 'none';
      showUI(true);
      $('#hint').classList.remove('hidden');
      setTimeout(() => $('#hint').classList.add('hidden'), 3500);
      requestWakeLock();
      requestAnimationFrame(loop);
    } catch (e) {
      const msg = (e && e.name === 'NotAllowedError')
        ? 'マイクが許可されませんでした。設定 › Safari › マイク を「確認」か「許可」にして、もう一度お試しください。'
        : 'マイクを開始できませんでした：' + (e && e.message ? e.message : e);
      $('#err').textContent = msg;
    }
  }
  $('#go').addEventListener('click', start);

  // 画面スリープ防止（iOS 16.4以降）
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  // 復帰時に再開
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && ctx) {
      try { if (ctx.state !== 'running') await ctx.resume(); } catch (_) {}
      requestWakeLock();
    }
  });

  // UI
  let uiTimer;
  function showUI(on) {
    ['#ui', '#level'].forEach(s => $(s).classList.toggle('hidden', !on));
    clearTimeout(uiTimer);
    if (on) uiTimer = setTimeout(() => showUI(false), 5000);
  }
  cv.addEventListener('click', () => {
    if (!analyser) return;
    if (ctx && ctx.state !== 'running') ctx.resume();
    showUI($('#ui').classList.contains('hidden'));
  });
  $('#ui').addEventListener('pointerdown', () => showUI(true));
  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    [...$('#modes').children].forEach(x => x.classList.toggle('on', x === b));
    particles.length = 0;
  });
  $('#pal').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    palette = +b.dataset.p;
    [...$('#pal').children].forEach(x => x.classList.toggle('on', x === b));
  });
  [...$('#pal').children].forEach((b, i) => b.style.color = PALETTES[i](0.5));
  $('#gain').addEventListener('input', e => gain = +e.target.value);

  // 周波数を対数スケールでN本にまとめる
  function bands(n) {
    const out = new Float32Array(n);
    const sr = ctx.sampleRate, binHz = sr / analyser.fftSize;
    const fMin = 40, fMax = 14000;
    for (let i = 0; i < n; i++) {
      const f0 = fMin * Math.pow(fMax / fMin, i / n);
      const f1 = fMin * Math.pow(fMax / fMin, (i + 1) / n);
      let a = Math.floor(f0 / binHz), b = Math.max(a + 1, Math.floor(f1 / binHz));
      let s = 0;
      for (let k = a; k < b && k < freq.length; k++) s = Math.max(s, freq[k]);
      out[i] = Math.min(1, (s / 255) * gain * (0.75 + 0.5 * i / n)); // 高域を少し持ち上げ
    }
    return out;
  }

  let energySmooth = 0, peak = 0;
  const particles = [];

  function loop() {
    requestAnimationFrame(loop);
    if (!analyser) return;
    analyser.getByteFrequencyData(freq);
    analyser.getByteTimeDomainData(wave);
    t += 1;

    // 全体の音量と低音
    let sum = 0;
    for (let i = 0; i < wave.length; i++) { const v = (wave[i] - 128) / 128; sum += v * v; }
    const rms = Math.min(1, Math.sqrt(sum / wave.length) * 4 * gain);
    energySmooth += (rms - energySmooth) * 0.2;
    const lvl = $('#level i'); lvl.style.height = (energySmooth * 100) + '%'; lvl.style.background = col(energySmooth);

    // 残像
    g.fillStyle = mode === 'wave' ? 'rgba(0,0,0,.25)' : mode === 'particles' ? 'rgba(0,0,0,.18)' : 'rgba(0,0,0,.35)';
    g.fillRect(0, 0, W, H);

    if (mode === 'bars') drawBars();
    else if (mode === 'circle') drawCircle();
    else if (mode === 'wave') drawWave();
    else drawParticles();
  }

  function drawBars() {
    const n = W < 500 ? 48 : 80;
    const b = bands(n);
    const gap = 3, bw = (W - gap * (n + 1)) / n;
    const base = H * 0.62;
    for (let i = 0; i < n; i++) {
      const h = b[i] * H * 0.5;
      const x = gap + i * (bw + gap);
      g.fillStyle = col(i / n);
      g.shadowColor = col(i / n); g.shadowBlur = 12 * b[i];
      g.fillRect(x, base - h, bw, h);
      g.globalAlpha = 0.25; g.shadowBlur = 0;
      g.fillRect(x, base + 4, bw, h * 0.45); // 反射
      g.globalAlpha = 1;
    }
    g.shadowBlur = 0;
  }

  function drawCircle() {
    const n = 120, b = bands(n / 2);
    const cx = W / 2, cy = H / 2;
    const r0 = Math.min(W, H) * (0.18 + energySmooth * 0.06);
    const maxL = Math.min(W, H) * 0.28;
    g.lineCap = 'round';
    g.lineWidth = Math.max(2, Math.min(W, H) / 160);
    const rot = t * 0.002;
    for (let i = 0; i < n; i++) {
      const v = b[i < n / 2 ? i : n - 1 - i]; // 左右対称
      const a = (i / n) * Math.PI * 2 + rot - Math.PI / 2;
      const l = 4 + v * maxL;
      g.strokeStyle = col(v);
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * (r0 + l), cy + Math.sin(a) * (r0 + l));
      g.stroke();
    }
    // 中心の円
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r0 * 0.9);
    grd.addColorStop(0, col(energySmooth)); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.25 + energySmooth * 0.6;
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, r0 * 0.9, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }

  function drawWave() {
    const layers = 3;
    for (let L = 0; L < layers; L++) {
      g.beginPath();
      g.lineWidth = 3 - L;
      g.strokeStyle = col(L / layers + energySmooth * 0.3);
      g.shadowColor = g.strokeStyle; g.shadowBlur = 10;
      const step = Math.max(1, Math.floor(wave.length / W));
      const amp = H * 0.35 * Math.min(2.5, gain) * (1 - L * 0.25);
      const offset = (L - 1) * 18;
      for (let x = 0, i = 0; x <= W; x += 2, i += step * 2) {
        const v = (wave[i % wave.length] - 128) / 128;
        const y = H / 2 + offset + v * amp;
        x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    g.shadowBlur = 0;
  }

  function drawParticles() {
    const b = bands(16);
    const bass = (b[0] + b[1] + b[2]) / 3;
    // 低音が跳ねたら粒子をまとめて放出
    const kick = bass > peak * 1.15 && bass > 0.35;
    peak = Math.max(bass, peak * 0.96);
    const count = Math.floor(energySmooth * 6) + (kick ? 40 : 0);
    const cx = W / 2, cy = H / 2;
    for (let i = 0; i < count && particles.length < 900; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (1 + Math.random() * 4) * (kick ? 2 : 1) * (0.6 + energySmooth);
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, h: Math.random(), r: 1 + Math.random() * 3 });
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.vy *= 0.99; p.life -= 0.008;
      if (p.life <= 0 || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) { particles.splice(i, 1); continue; }
      g.globalAlpha = p.life;
      g.fillStyle = col(p.h);
      g.beginPath(); g.arc(p.x, p.y, p.r * (1 + energySmooth), 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    // 中心のコア
    const R = 10 + bass * Math.min(W, H) * 0.12;
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, R * 2);
    grd.addColorStop(0, col(bass)); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, R * 2, 0, Math.PI * 2); g.fill();
  }
})();
</script>
</body>
</html>
