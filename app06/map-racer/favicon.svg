<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2b45"/><stop offset="1" stop-color="#0b111c"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a606a"/><stop offset="1" stop-color="#2c3038"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a4a"/><stop offset="1" stop-color="#d72a10"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 地図のグリッド -->
  <g stroke="#2f4566" stroke-width="10" opacity=".8">
    <path d="M0 120H512M0 250H512M110 0V512M300 0V512M420 0V512"/>
  </g>
  <!-- 曲がりくねった道 -->
  <path d="M60 470 C 60 330, 200 360, 230 280 S 180 140, 300 110 S 470 150, 460 40" fill="none" stroke="#11151b" stroke-width="104" stroke-linecap="round"/>
  <path d="M60 470 C 60 330, 200 360, 230 280 S 180 140, 300 110 S 470 150, 460 40" fill="none" stroke="url(#road)" stroke-width="86" stroke-linecap="round"/>
  <path d="M60 470 C 60 330, 200 360, 230 280 S 180 140, 300 110 S 470 150, 460 40" fill="none" stroke="#ffd23f" stroke-width="7" stroke-dasharray="26 22"/>
