    <rect x="-22" y="-16" width="11" height="10" fill="#111"/><rect x="0" y="-16" width="11" height="10" fill="#111"/>
    <rect x="-11" y="-6" width="11" height="10" fill="#111"/><rect x="11" y="-6" width="11" height="10" fill="#111"/>
