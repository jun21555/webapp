    <rect x="-56" y="-100" width="112" height="200" rx="32" fill="url(#car)"/>
    <rect x="-40" y="-46" width="80" height="78" rx="16" fill="#1a2433"/>
    <rect x="-34" y="-40" width="68" height="20" rx="8" fill="#7fb3ff" opacity=".55"/>
    <rect x="-46" y="70" width="92" height="14" rx="6" fill="#11151b"/>
    <rect x="-44" y="-96" width="22" height="12" rx="4" fill="#fff6c8"/><rect x="22" y="-96" width="22" height="12" rx="4" fill="#fff6c8"/>
    <rect x="-5" y="-100" width="10" height="200" fill="#fff" opacity=".9"/>
  </g>
