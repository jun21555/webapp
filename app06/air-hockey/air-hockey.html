<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="エアホッケー">
<meta name="theme-color" content="#070b24">
<title>オンライン エアホッケー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#070b24;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--sub:#a9b2d6;
    --me:#22e4ff;--op:#ff3d8b;--puck:#ffe14d;--ok:#3ddc84;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{min-height:100dvh;
    background:radial-gradient(90% 50% at 50% 0%,#1b2470 0%,transparent 70%),radial-gradient(80% 50% at 50% 100%,#3a0d4f 0%,transparent 70%),var(--bg)}
  .hidden{display:none!important}
  button,input{font:inherit;color:inherit}
  main{height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px)}

  /* ---- 上部バー ---- */
  .top{display:flex;align-items:center;gap:8px;height:48px;flex:none}
  .title{flex:1;text-align:center;font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:44px;padding:0 16px;cursor:pointer;
    font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#fff;
    transition:transform .12s,background .12s;-webkit-user-select:none;user-select:none}
  .btn:active{transform:scale(.95);background:rgba(255,255,255,.14)}
  .btn:disabled{opacity:.5}
  .btn.round{width:44px;height:44px;padding:0;border-radius:50%;flex:none}
  .btn.round svg{width:22px;height:22px}
  .btn.primary{background:linear-gradient(135deg,#19c9ff,#5b6bff);border:none;box-shadow:0 6px 18px rgba(40,140,255,.35)}
  .btn.pink{background:linear-gradient(135deg,#ff4f9a,#b84dff);border:none;box-shadow:0 6px 18px rgba(255,60,150,.3)}
  .btn.wide{width:100%}
  .spacer{width:44px;flex:none}

  /* ---- メニュー ---- */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:4px 12px 20px}
  .hero{text-align:center;margin:6px 0 16px}
  .hero img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(0,200,255,.3)}
  .hero h1{margin:10px 0 2px;font-size:26px;letter-spacing:2px;
    background:linear-gradient(90deg,var(--me),#fff,var(--op));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0;color:var(--sub);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
  .card h2{margin:0;font-size:17px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .small{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
  input[type=text],input[type=email],input[type=password]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.3);padding:0 14px;font-size:16px;outline:none}
  input:focus{border-color:var(--me)}
  #codeInput{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700;font-size:20px}
  .seg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;height:40px;border:none;background:transparent;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
  .seg button.on{background:rgba(255,255,255,.16);color:#fff}
  .note{font-size:12px;color:var(--sub);line-height:1.6;margin:0}
  .err{color:#ffb4b4;font-size:13px;line-height:1.6;margin:0}
  .acct{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
  .acct b{color:#fff;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkbtn{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:13px;min-height:44px;cursor:pointer;padding:0 4px}
  .or{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---- 待機 ---- */
  .wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .code{font-size:56px;font-weight:800;letter-spacing:12px;padding-left:12px;color:var(--me);text-shadow:0 0 24px rgba(34,228,255,.5);font-variant-numeric:tabular-nums}
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--me);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.8);opacity:.3}}

  /* ---- ゲーム ---- */
  #gameView{flex:1;display:flex;flex-direction:column;min-height:0}
  .hud{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);height:22px;padding:0 4px;flex:none}
  .hud .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:0}
  .hud .dot.bad{background:#ffb02e}
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  /* ---- ダイアログ ---- */
  .overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:24px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .dialog{width:min(100%,340px);background:#121845;border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .dialog h3{margin:0 0 6px;font-size:28px}
  .dialog p{margin:0 0 16px;color:var(--sub);font-size:14px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);width:max-content;max-width:calc(100% - 40px);
    transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;
    z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="btn round" id="homeBtn" href="../index.html" aria-label="ホームへ戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
    </a>
    <div class="title" id="title">エアホッケー</div>
    <button class="btn round hidden" id="quitBtn" type="button" aria-label="ゲームをやめる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="spacer" id="topSpacer"></div>
  </div>

  <!-- ===== メニュー ===== -->
  <section class="scroll" id="menuView">
    <div class="hero">
      <img src="apple-touch-icon.png" alt="">
      <h1>AIR HOCKEY</h1>
      <p>7点先取。友だちとオンラインで対戦しよう</p>
    </div>

    <div class="card stack">
      <div>
        <label class="small" for="nameInput">あなたの名前</label>
        <input type="text" id="nameInput" maxlength="12" placeholder="なまえ" autocomplete="nickname">
      </div>
    </div>

    <div class="card stack">
      <h2>オンライン対戦</h2>
      <p class="note" id="authLoading">ログイン状態を確認しています…</p>

      <div class="stack hidden" id="loginBox">
        <p class="note">オンライン対戦にはログインが必要です（オセロ・かぞく予定と同じアカウント）。</p>
        <button class="btn wide" id="googleBtn" type="button">Google でログイン</button>
        <div class="or">または</div>
        <form class="stack" id="emailForm">
          <input type="email" id="email" placeholder="メールアドレス" autocomplete="email" required>
          <input type="password" id="password" placeholder="パスワード（6文字以上）" autocomplete="current-password" minlength="6" required>
          <div class="row">
            <button class="btn" type="submit" data-mode="login">ログイン</button>
            <button class="btn" type="submit" data-mode="signup">新規登録</button>
          </div>
        </form>
      </div>

      <div class="stack hidden" id="onlineBox">
        <div class="acct"><span>ログイン中：</span><b id="acctName"></b><button class="linkbtn" id="logoutBtn" type="button">ログアウト</button></div>
        <button class="btn primary wide" id="createBtn" type="button">部屋をつくる</button>
        <div class="row">
          <input type="text" id="codeInput" maxlength="4" placeholder="コード" autocomplete="off" autocapitalize="characters" inputmode="text">
          <button class="btn pink" id="joinBtn" type="button" style="flex:.7">参加する</button>
        </div>
      </div>
      <p class="err hidden" id="onlineErr"></p>
    </div>

    <div class="card stack">
      <h2>この端末で遊ぶ</h2>
      <div>
        <span class="small">CPU の強さ</span>
        <div class="seg" id="levelSeg">
          <button type="button" data-lv="0">よわい</button>
          <button type="button" data-lv="1" class="on">ふつう</button>
          <button type="button" data-lv="2">つよい</button>
        </div>
      </div>
      <button class="btn primary wide" id="cpuBtn" type="button">CPU と対戦</button>
      <button class="btn wide" id="localBtn" type="button">ふたりで対戦（1台を向かい合って）</button>
    </div>
    <p class="note" style="text-align:center">指でマレット（自分の打つ道具）を動かしてパックを打ち返そう</p>
  </section>

  <!-- ===== 待機 ===== -->
  <section class="wait hidden" id="waitView">
    <p class="note">この部屋コードを相手に伝えてください</p>
    <div class="code" id="codeText">----</div>
    <button class="btn primary" id="shareBtn" type="button">招待を送る</button>
    <div class="pulse"></div>
    <p class="note" id="waitText">相手の参加を待っています…</p>
  </section>

  <!-- ===== ゲーム ===== -->
  <section class="hidden" id="gameView">
    <div class="hud"><span id="hudLeft"></span><span id="hudRight"></span></div>
    <div id="stage"><canvas id="cv"></canvas></div>
  </section>
</main>

<div class="overlay hidden" id="dlg">
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="stack" id="dlgBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
