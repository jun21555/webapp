<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e36"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3a"/>
      <stop offset=".5" stop-color="#ff3d2a"/>
      <stop offset="1" stop-color="#c4241a"/>
    </linearGradient>
    <radialGradient id="smoke" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f2f2f5" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f2f2f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- kerb arc -->
  <path d="M-20 470 A420 420 0 0 1 470 -20" fill="none" stroke="#f2f2f2" stroke-width="26"/>
  <path d="M-20 470 A420 420 0 0 1 470 -20" fill="none" stroke="#d8342c" stroke-width="26" stroke-dasharray="40 40"/>
  <!-- skid marks -->
  <path d="M70 500 C120 400 190 330 250 300" fill="none" stroke="#0b0c0e" stroke-width="14" stroke-linecap="round" opacity=".8"/>
  <path d="M120 512 C170 420 230 370 290 345" fill="none" stroke="#0b0c0e" stroke-width="14" stroke-linecap="round" opacity=".8"/>
  <!-- smoke -->
  <circle cx="190" cy="390" r="95" fill="url(#smoke)"/>
  <circle cx="120" cy="450" r="110" fill="url(#smoke)" opacity=".8"/>
  <circle cx="250" cy="340" r="70" fill="url(#smoke)"/>
  <!-- car (sliding, angled) -->
  <g transform="translate(300 250) rotate(-62)">
    <rect x="-118" y="-58" width="236" height="116" rx="12" fill="#000" opacity=".35" transform="translate(10 14)"/>
    <rect x="62" y="-60" width="40" height="18" rx="4" fill="#111" transform="rotate(-20 82 -51)"/>
    <rect x="62" y="42" width="40" height="18" rx="4" fill="#111" transform="rotate(-20 82 51)"/>
    <rect x="-98" y="-60" width="40" height="18" rx="4" fill="#111"/>
    <rect x="-98" y="42" width="40" height="18" rx="4" fill="#111"/>
    <rect x="-118" y="-52" width="236" height="104" rx="26" fill="url(#body)"/>
    <rect x="-118" y="-8" width="236" height="16" fill="#f4f1ea"/>
    <rect x="20" y="-42" width="48" height="84" rx="10" fill="#1b2430"/>
    <rect x="-52" y="-40" width="70" height="80" rx="8" fill="#d9361f"/>
    <rect x="-52" y="-7" width="70" height="14" fill="#f4f1ea"/>
    <rect x="-80" y="-38" width="26" height="76" rx="7" fill="#1b2430"/>
    <rect x="108" y="-48" width="8" height="20" fill="#fff6cc"/>
    <rect x="108" y="28" width="8" height="20" fill="#fff6cc"/>
  </g>
</svg>
