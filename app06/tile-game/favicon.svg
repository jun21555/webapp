<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="0" fill="#111111"/>
  <!-- 4x4タイルグリッド（赤・青） -->
  <!-- 行1 -->
  <rect x="80"  y="80"  width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="168" y="80"  width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="272" y="80"  width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="360" y="80"  width="72" height="72" rx="12" fill="#e74c3c"/>
  <!-- 行2 -->
  <rect x="80"  y="168" width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="168" y="168" width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="272" y="168" width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="360" y="168" width="72" height="72" rx="12" fill="#2980b9"/>
  <!-- 行3 -->
  <rect x="80"  y="272" width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="168" y="272" width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="272" y="272" width="72" height="72" rx="12" fill="#e74c3c"/>
  <rect x="360" y="272" width="72" height="72" rx="12" fill="#e74c3c"/>
  <!-- 行4 -->
  <rect x="80"  y="360" width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="168" y="360" width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="272" y="360" width="72" height="72" rx="12" fill="#2980b9"/>
  <rect x="360" y="360" width="72" height="72" rx="12" fill="#2980b9"/>
</svg>
