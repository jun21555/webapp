<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タイルゲーム">
<meta name="theme-color" content="#111111">
<title>タイルゲーム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100dvh;
    overflow: hidden;
    background: #0a0a0a;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0,255,80,0.03) 0px,
      rgba(0,255,80,0.03) 1px,
      transparent 1px,
      transparent 4px
    );
    color: #e0e0e0;
    font-family: "Courier New", Courier, monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      12px
      calc(env(safe-area-inset-bottom) + 8px);
  }

  /* ── ヘッダー ── */
  .header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  #home-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform .15s, background .15s;
    flex-shrink: 0;
  }
  #home-btn:active { transform: scale(.88); }
  #home-btn svg { width: 18px; height: 18px; }
  .title { font-size: 13px; letter-spacing: 2px; color: #00ff50; text-shadow: 0 0 8px #00ff5088; }
  .header-right {
    display: flex; gap: 8px;
  }
  /* 一時停止・リセットボタン */
  .ctrl-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform .12s, background .12s;
  }
  .ctrl-btn:active { transform: scale(.88); background: rgba(255,255,255,.24); }
  .ctrl-btn svg { width: 18px; height: 18px; }

  /* ── グリッド共通 ── */
  .grid-section { width: 100%; max-width: 420px; flex-shrink: 0; }
  .grid-label {
    font-size: 10px; color: #00cc40; letter-spacing: 2px;
    text-align: center; margin-bottom: 3px;
    text-shadow: 0 0 6px #00cc4066;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 2px;
  }
  .tile {
    width: 100%; aspect-ratio: 1;
    border-radius: 3px;
    transition: background 0.12s;
  }
  .tile.red  {
    background: #f0f0f0;
    box-shadow: inset 0 0 0 1.5px #bbb, inset 2px 2px 0 #fff, inset -2px -2px 0 #999;
    image-rendering: pixelated;
  }
  .tile.blue {
    background: #1a1a1a;
    box-shadow: inset 0 0 0 1.5px #000, inset 2px 2px 0 #333, inset -2px -2px 0 #000;
    image-rendering: pixelated;
  }

  /* 目標グリッドは小さめ */
  #target-grid .tile { border-radius: 2px; }

  /* ── 仕切り ── */
  .divider {
    width: 100%; max-width: 420px;
    border: none; border-top: 1px solid #00ff5033;
    margin: 5px 0;
    flex-shrink: 0;
  }

  /* ── シャッフルボタン ── */
  #shuffle-btn {
    padding: 0 32px;
    font-size: 15px; font-weight: bold;
    background: #0a0a0a;
    color: #00ff50;
    border: 2px solid #00ff50;
    border-radius: 4px;
    cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 0 12px #00ff5055, inset 0 0 8px #00ff5011;
    height: 48px;
    width: 100%; max-width: 420px;
    transition: transform .1s, box-shadow .1s, background .1s;
    flex-shrink: 0;
    margin: 5px 0;
    font-family: "Courier New", Courier, monospace;
    text-shadow: 0 0 8px #00ff50;
  }
  #shuffle-btn:active {
    transform: scale(.96);
    background: #00ff5022;
    box-shadow: 0 0 20px #00ff5099, inset 0 0 12px #00ff5033;
  }
  #shuffle-btn:disabled { border-color: #333; color: #333; cursor: default; box-shadow: none; text-shadow: none; background: #0a0a0a; }

  /* ── HUD ── */
  .hud {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-around;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 10px; color: #00883a; letter-spacing: 1px; }
  .hud-value { font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.3; font-family: "Courier New", Courier, monospace; }
  .hud-value.green  { color: #00ff50; text-shadow: 0 0 8px #00ff5088; }
  .hud-value.yellow { color: #ffe000; text-shadow: 0 0 8px #ffe00088; }
  .hud-value.red    { color: #ff4040; text-shadow: 0 0 8px #ff404088; }
  .hud-value.gold   { color: #ffe000; text-shadow: 0 0 8px #ffe00088; }

  /* ── オーバーレイ（クリア・ポーズ共用） ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.93);
    background-image: repeating-linear-gradient(
      0deg, rgba(0,255,80,0.04) 0px, rgba(0,255,80,0.04) 1px, transparent 1px, transparent 4px
    );
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; z-index: 200;
    font-family: "Courier New", Courier, monospace;
  }
  .overlay.show { display: flex; }
  .overlay .emoji { font-size: 52px; }
  .overlay .ov-title { font-size: 26px; font-weight: bold; letter-spacing: 3px; }
  .overlay .ov-time  { font-size: 32px; font-weight: bold; letter-spacing: 2px; }
  .overlay .ov-info  { font-size: 13px; color: #00883a; letter-spacing: 1px; }
  .overlay .ov-best  { font-size: 14px; font-weight: bold; color: #ffe000; text-shadow: 0 0 8px #ffe00088; }
  .ov-buttons { display: flex; gap: 12px; margin-top: 8px; }
  .ov-btn {
    padding: 13px 28px; font-size: 14px; font-weight: bold;
    border: 2px solid; border-radius: 4px; cursor: pointer;
    min-height: 48px; min-width: 120px;
    transition: transform .12s, background .12s;
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 2px;
    background: transparent;
  }
  .ov-btn:active { transform: scale(.93); }
  .ov-btn.green { border-color: #00ff50; color: #00ff50; text-shadow: 0 0 8px #00ff5088; box-shadow: 0 0 10px #00ff5044; }
  .ov-btn.green:active { background: #00ff5022; }
  .ov-btn.gray  { border-color: #555; color: #888; }
  .ov-btn.gray:active { background: #ffffff11; }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <a id="home-btn" href="../index.html" aria-label="ホームへ戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  </a>
  <span class="title">🔴🔵 タイムアタック</span>
  <div class="header-right">
    <!-- 一時停止 -->
    <button class="ctrl-btn" id="pause-btn" aria-label="一時停止">
      <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>
    <!-- リセット -->
    <button class="ctrl-btn" id="reset-btn" aria-label="最初からスタート">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 1 2.6 6.4"/>
        <path d="M3 21v-5h5"/>
      </svg>
    </button>
  </div>
</div>

<!-- 目標グリッド（小さめ） -->
<div class="grid-section" id="target-section">
  <p class="grid-label">🎯 目標パターン（左右対称）</p>
  <div class="grid" id="target-grid" style="gap:2px;"></div>
</div>

<hr class="divider">

<!-- 現在のタイル -->
<div class="grid-section">
  <p class="grid-label">🎮 現在のタイル</p>
  <div class="grid" id="current-grid"></div>
</div>

<!-- シャッフルボタン -->
<button id="shuffle-btn">シャッフル！</button>

<!-- HUD -->
<div class="hud">
  <div class="hud-item">
    <div class="hud-label">タイム</div>
    <div class="hud-value green" id="hud-time">00.00</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">一致率</div>
    <div class="hud-value" id="hud-match">0%</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">ベスト</div>
    <div class="hud-value gold" id="hud-best">--:--</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">シャッフル</div>
    <div class="hud-value" id="hud-count">0</div>
  </div>
</div>

<!-- クリアオーバーレイ -->
<div class="overlay" id="clear-overlay">
  <div class="emoji">🎉</div>
  <div class="ov-title" style="color:#00ff50;text-shadow:0 0 16px #00ff50;">CLEAR!</div>
  <div class="ov-time" id="ov-time"></div>
  <div class="ov-info" id="ov-info"></div>
  <div class="ov-best" id="ov-best"></div>
  <div class="ov-buttons">
    <button class="ov-btn green" id="retry-btn">もう一度</button>
    <button class="ov-btn gray"  id="new-btn">新しいゲーム</button>
  </div>
</div>

<!-- ポーズオーバーレイ -->
<div class="overlay" id="pause-overlay">
  <div class="emoji">⏸️</div>
  <div class="ov-title" style="color:#ffe000;text-shadow:0 0 12px #ffe000;">PAUSE</div>
  <div class="ov-buttons">
    <button class="ov-btn green" id="resume-btn">再開</button>
    <button class="ov-btn gray"  id="pause-reset-btn">最初から</button>
  </div>
</div>

<script>
const ROWS = 8, COLS = 8;

function genSymmetric() {
  return Array.from({ length: ROWS }, () => {
    const half = Array.from({ length: COLS / 2 }, () => Math.random() < 0.5);
    return [...half, ...[...half].reverse()];
  });
}
function genAsymmetric() {
  for (;;) {
    const g = Array.from({ length: ROWS }, () =>
      Array.from({ length: COLS }, () => Math.random() < 0.5));
    if (!isSymmetric(g)) return g;
  }
}
function genShuffled(tgt) {
  for (let i = 0; i < 100; i++) {
    const g = genSymmetric();
    if (!matchesTarget(g, tgt)) return g;
  }
  return genSymmetric();
}
function isSymmetric(g) {
  return g.every(r => r.every((v, c) => v === r[COLS - 1 - c]));
}
function matchesTarget(g, tgt) {
  return g.every((r, ri) => r.every((v, c) => v === tgt[ri][c]));
}
function fmt(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  const ss = s % 60, cs = Math.floor((ms % 1000) / 10);
  return m > 0
    ? `${m}:${String(ss).padStart(2,'0')}.${String(cs).padStart(2,'0')}`
    : `${String(ss).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

// --- 状態 ---
let target, tiles, startTime, pauseStart, pausedMs, elapsed, shuffleCount, bestTime, phase, rafId;
// phase: 'playing' | 'paused' | 'clear'

// --- DOM ---
const $  = id => document.getElementById(id);
const targetGrid   = $('target-grid');
const currentGrid  = $('current-grid');
const shuffleBtn   = $('shuffle-btn');
const pauseBtn     = $('pause-btn');
const pauseIcon    = $('pause-icon');
const resetBtn     = $('reset-btn');
const clearOverlay = $('clear-overlay');
const pauseOverlay = $('pause-overlay');
const hudTime      = $('hud-time');
const hudMatch     = $('hud-match');
const hudBest      = $('hud-best');
const hudCount     = $('hud-count');
const ovTime       = $('ov-time');
const ovInfo       = $('ov-info');
const ovBest       = $('ov-best');

function renderGrid(el, grid) {
  el.innerHTML = '';
  grid.flat().forEach(isRed => {
    const d = document.createElement('div');
    d.className = 'tile ' + (isRed ? 'red' : 'blue');
    el.appendChild(d);
  });
}

// 目標グリッドを小さくするためにCSS変数で制御
function applyTargetSize() {
  // target-gridのタイルを0.6倍に（gap・sectionで調整）
  $('target-section').style.transform = 'scale(0.62)';
  $('target-section').style.transformOrigin = 'top center';
  $('target-section').style.marginBottom = `calc((0.62 - 1) * 100%)`;
}

function calcMatch() {
  let m = 0;
  tiles.forEach((r, ri) => r.forEach((v, c) => { if (v === target[ri][c]) m++; }));
  return Math.round(m / (ROWS * COLS) * 100);
}

function getElapsed() {
  if (phase === 'playing') return Date.now() - startTime - pausedMs;
  return elapsed;
}

function updateHudTime() {
  const ms = getElapsed();
  hudTime.textContent = fmt(ms);
  hudTime.className = 'hud-value ' + (ms < 10000 ? 'green' : ms < 30000 ? 'yellow' : 'red');
}

function loop() {
  if (phase === 'playing') { updateHudTime(); rafId = requestAnimationFrame(loop); }
}

// 一時停止アイコン切り替え
function setPauseIcon(playing) {
  pauseIcon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
    : '<polygon points="5,3 19,12 5,21"/>';
}

function startGame(keepBest = true) {
  if (!keepBest) bestTime = null;
  target = genSymmetric();
  tiles  = genAsymmetric();
  startTime = Date.now();
  pausedMs = 0;
  elapsed = 0;
  shuffleCount = 0;
  phase = 'playing';
  clearOverlay.classList.remove('show');
  pauseOverlay.classList.remove('show');
  shuffleBtn.disabled = false;
  setPauseIcon(true);

  renderGrid(targetGrid, target);
  renderGrid(currentGrid, tiles);
  hudCount.textContent = '0';
  hudMatch.textContent = calcMatch() + '%';
  hudBest.textContent = bestTime !== null ? fmt(bestTime) : '--:--';
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
  applyTargetSize();
}

function showClear() {
  elapsed = getElapsed();
  phase = 'clear';
  cancelAnimationFrame(rafId);
  updateHudTime();
  const isNew = bestTime === null || elapsed < bestTime;
  if (isNew) bestTime = elapsed;
  hudBest.textContent = fmt(bestTime);
  ovTime.textContent = fmt(elapsed);
  ovTime.className = 'ov-time ' + (elapsed < 10000 ? 'green' : elapsed < 30000 ? 'yellow' : 'red');
  ovInfo.textContent = `シャッフル ${shuffleCount} 回`;
  ovBest.textContent = isNew ? '🏆 ベスト更新！' : '';
  clearOverlay.classList.add('show');
  shuffleBtn.disabled = true;
  setPauseIcon(true);
}

function pause() {
  if (phase !== 'playing') return;
  pauseStart = Date.now();
  phase = 'paused';
  cancelAnimationFrame(rafId);
  pauseOverlay.classList.add('show');
  shuffleBtn.disabled = true;
  setPauseIcon(false);
}

function resume() {
  if (phase !== 'paused') return;
  pausedMs += Date.now() - pauseStart;
  phase = 'playing';
  pauseOverlay.classList.remove('show');
  shuffleBtn.disabled = false;
  setPauseIcon(true);
  rafId = requestAnimationFrame(loop);
}

// --- イベント ---
shuffleBtn.addEventListener('click', () => {
  if (phase !== 'playing') return;
  tiles = genShuffled(target);
  renderGrid(currentGrid, tiles);
  shuffleCount++;
  hudCount.textContent = shuffleCount;
  hudMatch.textContent = calcMatch() + '%';
  if (matchesTarget(tiles, target)) showClear();
});

pauseBtn.addEventListener('click', () => {
  if (phase === 'playing') pause();
  else if (phase === 'paused') resume();
});

resetBtn.addEventListener('click', () => startGame(true));

$('retry-btn').addEventListener('click', () => startGame(true));   // ベスト維持・新パターン
$('new-btn').addEventListener('click',   () => startGame(true));   // 同上（同じ動作）
$('resume-btn').addEventListener('click', resume);
$('pause-reset-btn').addEventListener('click', () => startGame(true));

startGame(false);
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
