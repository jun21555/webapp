<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="app06">
<meta name="theme-color" content="#1b1440">
<title>app06</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:
      radial-gradient(120% 70% at 15% 0%,#ff6aa2 0%,transparent 55%),
      radial-gradient(110% 70% at 100% 30%,#6b5cff 0%,transparent 60%),
      radial-gradient(120% 80% at 30% 100%,#00b3c6 0%,transparent 60%),
      #1b1440;
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);
  }
  header{text-align:center;margin:8px 0 34px;text-shadow:0 1px 12px rgba(0,0,0,.25)}
  #date{font-size:15px;font-weight:600;opacity:.92}
  #time{font-size:76px;font-weight:700;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px;
    max-width:420px;margin:0 auto;
  }
  @media (max-width:340px){.grid{grid-template-columns:repeat(3,1fr)}}
  .app{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .icon{width:64px;height:64px;border-radius:15px;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.18);
    transition:transform .15s ease,filter .15s ease;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
  .icon svg,.icon img{display:block;width:100%;height:100%}
  .app:active .icon{transform:scale(.88);filter:brightness(.8)}
  .name{margin-top:7px;font-size:11.5px;font-weight:500;max-width:76px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.45)}
  .app:nth-child(2) .icon{animation-delay:.04s}.app:nth-child(3) .icon{animation-delay:.08s}
  .app:nth-child(4) .icon{animation-delay:.12s}.app:nth-child(5) .icon{animation-delay:.16s}
  .app:nth-child(6) .icon{animation-delay:.2s}.app:nth-child(7) .icon{animation-delay:.24s}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .dots{display:flex;justify-content:center;gap:7px;margin:40px 0 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .dots i:first-child{background:#fff}
</style>
</head>
<body>
<header>
  <div id="date"></div>
  <div id="time">--:--</div>
</header>

<nav class="grid">
  <!-- ピンボール -->
  <a class="app" href="pinball.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="pbBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0f6b"/><stop offset="1" stop-color="#0c1446"/></linearGradient>
        <radialGradient id="pbBall" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#d9dee5"/><stop offset="1" stop-color="#5b626b"/></radialGradient>
        <filter id="pbGlow"><feGaussianBlur stdDeviation="1.6"/></filter>
      </defs>
      <rect width="64" height="64" fill="url(#pbBg)"/>
      <circle cx="21" cy="20" r="7" fill="#ff2d8a" filter="url(#pbGlow)" opacity=".8"/>
      <circle cx="21" cy="20" r="5.5" fill="#ff2d8a" stroke="#fff" stroke-width="1.4"/>
      <circle cx="43" cy="17" r="5" fill="#ffcc33" stroke="#fff" stroke-width="1.3"/>
      <path d="M10 49 L27 56" stroke="#d0142c" stroke-width="7" stroke-linecap="round"/>
      <path d="M10 49 L27 56" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M54 49 L37 56" stroke="#d0142c" stroke-width="7" stroke-linecap="round"/>
      <path d="M54 49 L37 56" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M33 30 q5 5 1 13" stroke="#7ff6ff" stroke-width="1.2" fill="none" stroke-dasharray="2 2.5" opacity=".8"/>
      <circle cx="32" cy="43" r="5.2" fill="url(#pbBall)"/>
    </svg></div>
    <span class="name">ピンボール</span>
  </a>

  <!-- コップの水 -->
  <a class="app" href="cup.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="cpBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f8ff"/><stop offset="1" stop-color="#9fd8f5"/></linearGradient>
        <linearGradient id="cpWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#0a6fd6"/></linearGradient>
      </defs>
      <rect width="64" height="64" fill="url(#cpBg)"/>
      <g transform="rotate(-12 32 36)">
        <path d="M18 34 Q25 29 32 33 T46 32 L43.5 53 Q43 56 40 56 H24 Q21 56 20.5 53 Z" fill="url(#cpWater)"/>
        <path d="M16 14 H48 L43.5 53 Q43 56 40 56 H24 Q21 56 20.5 53 Z" fill="rgba(255,255,255,.25)" stroke="#5a8fb0" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M21 19 L24 50" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
      </g>
      <path d="M50 26 q3 4 0 6 q-3 -2 0 -6Z" fill="#2aa7f0"/>
      <path d="M54 35 q2.2 3 0 4.5 q-2.2 -1.5 0 -4.5Z" fill="#2aa7f0"/>
      <path d="M46 14 q2.5 3.4 0 5 q-2.5 -1.6 0 -5Z" fill="#2aa7f0" opacity=".8"/>
    </svg></div>
    <span class="name">コップの水</span>
  </a>

  <!-- Gメーター -->
  <a class="app" href="gmeter.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <radialGradient id="gmBg" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#0b0c0f"/></radialGradient>
        <radialGradient id="gmDot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#ff5a3c"/><stop offset="1" stop-color="rgba(255,90,60,0)"/></radialGradient>
      </defs>
      <rect width="64" height="64" fill="url(#gmBg)"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="#4be3a0" stroke-width="1.3" opacity=".9"/>
      <circle cx="32" cy="32" r="14.5" fill="none" stroke="#4be3a0" stroke-width="1" opacity=".55"/>
      <circle cx="32" cy="32" r="7" fill="none" stroke="#4be3a0" stroke-width="1" opacity=".35"/>
      <path d="M32 8 V56 M8 32 H56" stroke="#4be3a0" stroke-width=".8" opacity=".35"/>
      <path d="M32 32 L41 20" stroke="#ff5a3c" stroke-width="1.4" stroke-dasharray="2 2" opacity=".7"/>
      <circle cx="41" cy="20" r="8" fill="url(#gmDot)"/>
      <circle cx="41" cy="20" r="2.8" fill="#fff"/>
      <text x="32" y="60" text-anchor="middle" font-size="7" font-weight="800" fill="#4be3a0" font-family="-apple-system,Arial">G</text>
    </svg></div>
    <span class="name">Gメーター</span>
  </a>

  <!-- 現在地ダッシュボード -->
  <a class="app" href="location.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="lcBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a8dff"/><stop offset="1" stop-color="#1745c9"/></linearGradient>
      </defs>
      <rect width="64" height="64" fill="url(#lcBg)"/>
      <circle cx="46" cy="17" r="6" fill="#ffd23f"/>
      <g stroke="#ffd23f" stroke-width="1.8" stroke-linecap="round">
        <path d="M46 6.5v2.5M46 25v2.5M35.5 17h2.5M54 17h2.5M38.6 9.6l1.7 1.7M51.7 22.7l1.7 1.7M38.6 24.4l1.7-1.7M51.7 11.3l1.7-1.7"/>
      </g>
      <path d="M41 25 h13 a5 5 0 0 0 0-10 a7 7 0 0 0-13 2 a4 4 0 0 0 0 8Z" fill="#fff" opacity=".95" transform="translate(-3 4) scale(.95)"/>
      <rect x="8" y="38" width="48" height="18" rx="5" fill="rgba(255,255,255,.18)"/>
      <path d="M20 9 c-6.6 0 -11 4.8 -11 10.6 c0 7.4 11 18.4 11 18.4 s11 -11 11 -18.4 C31 13.8 26.6 9 20 9Z" fill="#ff3b30" stroke="#fff" stroke-width="1.6"/>
      <circle cx="20" cy="19.6" r="4" fill="#fff"/>
      <rect x="13" y="43" width="16" height="3" rx="1.5" fill="#fff"/>
      <rect x="13" y="49" width="10" height="2.4" rx="1.2" fill="#fff" opacity=".6"/>
      <text x="48" y="51.5" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="-apple-system,Arial">24°</text>
    </svg></div>
    <span class="name">現在地</span>
  </a>

  <!-- 現在地マップ -->
  <a class="app" href="map.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" fill="#e8efe2"/>
      <path d="M0 44 Q20 38 30 46 T64 40 V64 H0Z" fill="#a8d8f0"/>
      <path d="M38 0 V64" stroke="#fff" stroke-width="7"/>
      <path d="M0 22 L64 30" stroke="#fff" stroke-width="6"/>
      <path d="M38 0 V64" stroke="#ffcf5a" stroke-width="2.4"/>
      <path d="M0 22 L64 30" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect x="4" y="4" width="14" height="12" rx="2" fill="#bfe3a8"/>
      <rect x="46" y="6" width="13" height="16" rx="2" fill="#d5d9de"/>
      <rect x="6" y="28" width="10" height="8" rx="1.5" fill="#d5d9de"/>
      <circle cx="51" cy="44" r="4.5" fill="#ff9500" stroke="#fff" stroke-width="1.3"/>
      <circle cx="13" cy="54" r="4.5" fill="#34c759" stroke="#fff" stroke-width="1.3"/>
      <circle cx="26" cy="12" r="4.5" fill="#5856d6" stroke="#fff" stroke-width="1.3"/>
      <circle cx="32" cy="34" r="9" fill="#007aff" opacity=".22"/>
      <circle cx="32" cy="34" r="5" fill="#007aff" stroke="#fff" stroke-width="2.2"/>
    </svg></div>
    <span class="name">マップ</span>
  </a>

  <!-- サウンドビジュアライザー -->
  <a class="app" href="visualizer.html">
    <div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="vzBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0221"/><stop offset="1" stop-color="#25064a"/></linearGradient>
        <linearGradient id="vzBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".55" stop-color="#b14cff"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient>
      </defs>
      <rect width="64" height="64" fill="url(#vzBg)"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#b14cff" stroke-width="1" opacity=".35"/>
      <g fill="url(#vzBar)">
        <rect x="9" y="34" width="5" height="16" rx="2.5"/>
        <rect x="17" y="24" width="5" height="26" rx="2.5"/>
        <rect x="25" y="14" width="5" height="36" rx="2.5"/>
        <rect x="33" y="20" width="5" height="30" rx="2.5"/>
        <rect x="41" y="28" width="5" height="22" rx="2.5"/>
        <rect x="49" y="36" width="5" height="14" rx="2.5"/>
      </g>
      <path d="M6 56 Q14 52 20 56 T34 56 T48 56 T60 56" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity=".7"/>
    </svg></div>
    <span class="name">サウンド</span>
  </a>
  <!-- そら模様（天気・花粉・黄砂・PM2.5） -->
  <a class="app" href="weather/weather.html">
    <div class="icon"><img src="weather/apple-touch-icon.png" alt=""></div>
    <span class="name">そら模様</span>
  </a>
</nav>

<div class="dots"><i></i></div>

<script>
  const days=['日','月','火','水','木','金','土'];
  function tick(){
    const d=new Date();
    document.getElementById('time').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    document.getElementById('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+days[d.getDay()]+')';
  }
  tick(); setInterval(tick,10000);
</script>
</body>
</html>
