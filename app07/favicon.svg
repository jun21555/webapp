<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b4b"/>
      <stop offset="1" stop-color="#0b3b3a"/>
    </linearGradient>
    <linearGradient id="ph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4f7a"/>
      <stop offset="1" stop-color="#2a2d52"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ad19a"/>
      <stop offset="1" stop-color="#16946a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="92" cy="96" r="5" opacity=".8"/>
    <circle cx="150" cy="62" r="3" opacity=".6"/>
    <circle cx="420" cy="80" r="4" opacity=".7"/>
    <circle cx="452" cy="150" r="3" opacity=".5"/>
  </g>
  <!-- moon -->
  <path d="M396 102a58 58 0 1 0 50 88a48 48 0 1 1 -50 -88z" fill="#ffd968"/>
  <!-- Zzz -->
  <g fill="#ffffff" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="900">
    <text x="214" y="190" font-size="62" opacity=".95">Z</text>
    <text x="270" y="140" font-size="46" opacity=".75">z</text>
    <text x="310" y="104" font-size="34" opacity=".55">z</text>
  </g>
  <!-- sprout -->
  <path d="M256 330 V250" stroke="#2fbf86" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 272 C214 272 186 246 182 210 C222 208 252 232 256 272Z" fill="url(#gr)"/>
  <path d="M256 258 C296 258 326 230 332 192 C290 190 258 216 256 258Z" fill="url(#gr)"/>
  <!-- face-down phone (side view) -->
  <rect x="104" y="328" width="304" height="46" rx="23" fill="url(#ph)" stroke="#8c90c8" stroke-width="6"/>
  <rect x="140" y="340" width="70" height="8" rx="4" fill="#8c90c8" opacity=".6"/>
  <!-- table -->
  <rect x="60" y="384" width="392" height="14" rx="7" fill="#c9a37a"/>
  <rect x="60" y="398" width="392" height="10" rx="5" fill="#8e6a48"/>
</svg>
